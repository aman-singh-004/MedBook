<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedBook - Smart Appointment Booking</title>
    
    <!-- SEO Optimization -->
    <meta name="description" content="Book medical and clinic appointments easily with MedBook. Fast, secure, and hassle-free booking.">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-container glass-panel">
            <div class="auth-brand">
                <div class="logo-icon">🏥</div>
                <h1>MedBook</h1>
                <p>Smart Clinic Booking System</p>
            </div>

            <!-- Tab Headers -->
            <div class="auth-tabs">
                <div id="tab-login" class="auth-tab active" id="tab-login-btn">Log In</div>
                <div id="tab-register" class="auth-tab" id="tab-register-btn">Sign Up</div>
            </div>

            <!-- Login Section -->
            <div id="form-login" class="auth-form active">
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" class="form-control" placeholder="Enter username" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="login-submit-btn">Log In</button>
                </form>
            </div>

            <!-- Register Section -->
            <div id="form-register" class="auth-form">
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" class="form-control" placeholder="Choose a username" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email Address</label>
                        <input type="email" id="register-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="register-role">Register As</label>
                        <select id="register-role" class="form-control">
                            <option value="USER">Patient / Client</option>
                            <option value="ADMIN">Clinic Administrator</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" id="register-submit-btn">Sign Up</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
